name: Migrations

# Catches the "repair-without-apply" footgun that caused 2026-04-20 drift.
# Boots a fresh Supabase stack, applies every migration file in order,
# and fails if any statement errors. A clean apply proves the migrations
# folder is self-consistent and can regenerate prod schema from scratch.
# Then runs the full pgTAP suite and checks that the generated
# src/lib/database.types.ts matches the migrated schema.
#
# Out of scope: diff vs live prod. That gate requires prod credentials
# in CI and is tracked as a follow-up. See CLAUDE.md -> "Migration
# Workflow Discipline".

# Keep the two path lists identical: everything the apply, the pgTAP suite
# or the types check depends on.
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "scripts/ci/sync-queue-triage/**"
      - "src/lib/database.types.ts"
      - "scripts/gen-types.mjs"
      - "scripts/supabase-cli.mjs"
      - ".supabase-cli-version"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - ".nvmrc"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "scripts/ci/sync-queue-triage/**"
      - "src/lib/database.types.ts"
      - "scripts/gen-types.mjs"
      - "scripts/supabase-cli.mjs"
      - ".supabase-cli-version"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - ".nvmrc"
      - ".github/workflows/migrations.yml"

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-apply:
    name: Clean apply from empty DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Single source for the CLI version: .supabase-cli-version (also read
      # by scripts/supabase-cli.mjs and scripts/gen-types.mjs, which refuses
      # to generate types with any other version).
      - name: Read pinned Supabase CLI version
        id: cli
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: ${{ steps.cli.outputs.version }}

      # Neutralize seed.sql for the clean-apply check. This job only verifies
      # that every migration applies cleanly from an empty DB; it should NOT
      # execute production seed data. The checkout is ephemeral so this
      # overwrite never touches the committed file.
      #
      # Context: the committed seed.sql raises
      #   'No user found in auth.users. Sign up first!'
      # when run against a fresh DB with no users — which is exactly what this
      # CI job has. Seeding is orthogonal to drift detection.
      - name: Disable seed.sql for clean-apply check
        run: echo "-- seed disabled for migrations CI; see .github/workflows/migrations.yml" > supabase/seed.sql

      - name: Start local Supabase stack
        run: supabase start --ignore-health-check

      - name: Reset DB and apply all migrations
        id: reset
        run: supabase db reset --no-seed

      - name: List applied migrations
        run: supabase migration list --local

      - name: Fail on file-vs-applied count mismatch
        shell: bash
        run: |
          # Any migration file not tracked as applied by the local CLI
          # after db reset indicates a rejection or silent skip.
          set -o pipefail
          file_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          applied_count=$(supabase migration list --local --output-format json \
            | jq '[.migrations[] | select(.remote != null and .remote != "")] | length')
          echo "files=$file_count applied=$applied_count"
          if [ "$file_count" -ne "$applied_count" ]; then
            echo "::error::Migration file count ($file_count) != applied count ($applied_count). Drift between supabase/migrations and schema_migrations."
            exit 1
          fi

      # PR 31 (R-14/R-22): seed a stale sync_queue backlog, check the
      # operator's read-only dry run against the expected disjoint counts,
      # re-apply the scheduler migration so its OWN triage call runs over the
      # backlog, and assert every row's outcome.
      - name: Sync-queue backlog triage through the scheduler migration
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          test -n "$DB_URL"
          dir=scripts/ci/sync-queue-triage
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/seed.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -f "$dir/dry_run.sql" > "$RUNNER_TEMP/dry_run.txt"
          diff -u "$dir/expected_dry_run.txt" "$RUNNER_TEMP/dry_run.txt"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260920003100_scheduler_and_sync_queue_cron.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/check.sql"
          # seed.sql temporarily removes the later unique index so it can
          # reproduce a pre-PR-52 duplicate backlog. Restore the owning
          # migration only after check.sql proves PR 31's triage did the work;
          # replaying it earlier could mask a broken triage by deduping again.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260920005200_sync_queue_pending_unique.sql

      # Full pgTAP suite (every file in supabase/tests/database/): definer
      # grant guard, dashboard capture, cross-user RLS isolation, trust plane,
      # profile preferences. Locally: `npm run test:db`.
      - name: pgTAP suite
        run: supabase test db

      # Generated-types drift check. It also runs when the pgTAP suite
      # failed (as long as the migrations applied), so a PR sees both
      # results in one run. On failure the step prints the diff and the
      # regenerate commands (npm run gen:types:local).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies (Biome for type normalization)
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: npm ci --ignore-scripts

      - name: Check database.types.ts matches migrated schema
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        env:
          SUPABASE_BIN: supabase
        run: npm run gen:types:check

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true
