name: Migrations

# Catches the "repair-without-apply" footgun that caused 2026-04-20 drift.
# Boots a fresh Supabase stack, applies every migration file in order,
# and fails if any statement errors. A clean apply proves the migrations
# folder is self-consistent and can regenerate prod schema from scratch.
# Then runs the full pgTAP suite and checks that the generated
# src/lib/database.types.ts matches the migrated schema.
#
# Out of scope: diff vs live prod. That gate requires prod credentials
# in CI and is tracked as a follow-up. See CLAUDE.md -> "Migration
# Workflow Discipline".

# Keep the two path lists identical: everything the apply, the pgTAP suite
# or the types check depends on.
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "scripts/migration-gating/**"
      - "src/lib/database.types.ts"
      - "scripts/gen-types.mjs"
      - "scripts/supabase-cli.mjs"
      - ".supabase-cli-version"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - ".nvmrc"
      - "scripts/ci/sync-queue-triage/**"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "scripts/migration-gating/**"
      - "src/lib/database.types.ts"
      - "scripts/gen-types.mjs"
      - "scripts/supabase-cli.mjs"
      - ".supabase-cli-version"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - ".nvmrc"
      - ".github/workflows/migrations.yml"
      - "scripts/ci/sync-queue-triage/**"

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-apply:
    name: Clean apply from empty DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Single source for the CLI version: .supabase-cli-version (also read
      # by scripts/supabase-cli.mjs and scripts/gen-types.mjs, which refuses
      # to generate types with any other version).
      # Validated here for the same reason the two prod-facing workflows do
      # it: an empty/malformed value makes setup-cli silently fall back to its
      # own default, and a different CLI generates different types, which is
      # exactly what the gen:types:check step below compares against. The
      # regex is inlined (no Node yet at this point in the job).
      - name: Read pinned Supabase CLI version
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -r .supabase-cli-version ]; then
            echo "::error::.supabase-cli-version is missing or unreadable; refusing to run with an unpinned Supabase CLI."
            exit 1
          fi
          version="$(tr -d '[:space:]' < .supabase-cli-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.supabase-cli-version must hold a plain x.y.z version (got '${version}'); refusing to run with an unpinned Supabase CLI."
            exit 1
          fi
          echo "Pinned Supabase CLI: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: ${{ steps.cli.outputs.version }}

      # Neutralize seed.sql for the clean-apply check. This job only verifies
      # that every migration applies cleanly from an empty DB; it should NOT
      # execute production seed data. The checkout is ephemeral so this
      # overwrite never touches the committed file.
      #
      # Context: the committed seed.sql raises
      #   'No user found in auth.users. Sign up first!'
      # when run against a fresh DB with no users — which is exactly what this
      # CI job has. Seeding is orthogonal to drift detection.
      - name: Disable seed.sql for clean-apply check
        run: echo "-- seed disabled for migrations CI; see .github/workflows/migrations.yml" > supabase/seed.sql

      - name: Start local Supabase stack
        run: supabase start --ignore-health-check

      - name: Reset DB and apply all migrations
        id: reset
        run: supabase db reset --no-seed

      - name: List applied migrations
        run: supabase migration list --local

      - name: Fail on file-vs-applied count mismatch
        shell: bash
        run: |
          # Any migration file not tracked as applied by the local CLI
          # after db reset indicates a rejection or silent skip.
          set -o pipefail
          file_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          applied_count=$(supabase migration list --local --output-format json \
            | jq '[.migrations[] | select(.remote != null and .remote != "")] | length')
          echo "files=$file_count applied=$applied_count"
          if [ "$file_count" -ne "$applied_count" ]; then
            echo "::error::Migration file count ($file_count) != applied count ($applied_count). Drift between supabase/migrations and schema_migrations."
            exit 1
          fi

      # Full pgTAP suite (every file in supabase/tests/database/): definer
      # grant guard, dashboard capture, cross-user RLS isolation, trust plane,
      # profile preferences. Locally: `npm run test:db`.
      - name: pgTAP suite
        run: supabase test db

      # Test-count floor (PR 25 review R-21). `supabase test db` only checks
      # the exit code, and five of the six pgTAP files still use `no_plan()`,
      # so DELETING an assertion leaves CI green with a smaller suite. That
      # matters most for gamification_stats.test.sql, which is the only place
      # the "a crafted payload cannot write a derived counter" claim is
      # proven — a mutation that re-added the derived columns to the RPC's
      # INSERT list was fully green against the whole suite before this PR.
      # gamification_stats.test.sql itself now uses `SELECT plan(N)`; this
      # floor covers the other five files.
      #
      # Raise PGTAP_TEST_FLOOR whenever the suite grows. It is a floor, not
      # an equality check, so adding tests never fails the gate.
      - name: pgTAP test-count floor
        env:
          PGTAP_TEST_FLOOR: "763"
        run: |
          set -euo pipefail
          summary="$(supabase test db 2>&1 | tee /dev/stderr | grep -oE 'Tests=[0-9]+' | tail -1 || true)"
          if [ -z "$summary" ]; then
            echo "::error::Could not parse the pg_prove 'Tests=<n>' summary. The CLI output shape changed — fix this step rather than removing it."
            exit 1
          fi
          count="${summary#Tests=}"
          echo "pgTAP assertions run: $count (floor $PGTAP_TEST_FLOOR)"
          if [ "$count" -lt "$PGTAP_TEST_FLOOR" ]; then
            echo "::error::pgTAP suite shrank: $count assertions ran, floor is $PGTAP_TEST_FLOOR. An assertion was deleted, or a no_plan() file stopped running. Restore it, or lower the floor deliberately in the same commit."
            exit 1
          fi

      # Generated-types drift check. It also runs when the pgTAP suite
      # failed (as long as the migrations applied), so a PR sees both
      # results in one run. On failure the step prints the diff and the
      # regenerate commands (npm run gen:types:local).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies (Biome for type normalization)
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: npm ci --ignore-scripts

      - name: Check database.types.ts matches migrated schema
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        env:
          SUPABASE_BIN: supabase
        run: npm run gen:types:check

      - name: Sync-queue backlog triage through the scheduler migration
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          test -n "$DB_URL"
          dir=scripts/ci/sync-queue-triage
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/seed.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -f "$dir/dry_run.sql" > "$RUNNER_TEMP/dry_run.txt"
          diff -u "$dir/expected_dry_run.txt" "$RUNNER_TEMP/dry_run.txt"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260920003100_scheduler_and_sync_queue_cron.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/check.sql"

      # Gating checks for 20260920007600: it must be a no-op against a
      # prod-shaped schema, idempotent, and correct on a drifted database that
      # has rows (the pgTAP suite runs against an empty DB, so its backfill and
      # its text->jsonb USING clause are never exercised there). Destructive:
      # it drifts and re-converges this throwaway DB, so it runs last.
      - name: Migration gating (no-op, idempotency, drifted-with-data)
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # `supabase status` may print deprecation warnings alongside the
          # JSON; fall back to the default [db].port (config.toml sets none).
          DB_URL="$(supabase status -o json 2>/dev/null | jq -r '.DB_URL // empty')"
          [ -n "$DB_URL" ] || DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          export DB_URL
          bash scripts/migration-gating/run.sh

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true
