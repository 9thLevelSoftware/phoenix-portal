name: Migrations

# Catches the "repair-without-apply" footgun that caused 2026-04-20 drift.
# Boots a fresh Supabase stack, applies every migration file in order,
# and fails if any statement errors. A clean apply proves the migrations
# folder is self-consistent and can regenerate prod schema from scratch.
#
# Out of scope: diff vs live prod. That gate requires prod credentials
# in CI and is tracked as a follow-up. See CLAUDE.md -> "Migration
# Workflow Discipline".

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "src/lib/database.types.ts"
      - "scripts/gen-types.mjs"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "src/lib/database.types.ts"

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-apply:
    name: Clean apply from empty DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.76.9

      # Neutralize seed.sql for the clean-apply check. This job only verifies
      # that every migration applies cleanly from an empty DB; it should NOT
      # execute production seed data. The checkout is ephemeral so this
      # overwrite never touches the committed file.
      #
      # Context: the committed seed.sql raises
      #   'No user found in auth.users. Sign up first!'
      # when run against a fresh DB with no users — which is exactly what this
      # CI job has. Seeding is orthogonal to drift detection.
      - name: Disable seed.sql for clean-apply check
        run: echo "-- seed disabled for migrations CI; see .github/workflows/migrations.yml" > supabase/seed.sql

      - name: Start local Supabase stack
        run: supabase start --ignore-health-check

      - name: Reset DB and apply all migrations
        run: supabase db reset --no-seed

      - name: List applied migrations
        run: supabase migration list --local

      - name: Fail on file-vs-applied count mismatch
        shell: bash
        run: |
          # Any migration file not tracked as applied by the local CLI
          # after db reset indicates a rejection or silent skip.
          file_count=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)
          applied_count=$(supabase migration list --local 2>/dev/null | grep -E '^\s*[0-9]+' | wc -l)
          echo "files=$file_count applied=$applied_count"
          if [ "$file_count" -ne "$applied_count" ]; then
            echo "::error::Migration file count ($file_count) != applied count ($applied_count). Drift between supabase/migrations and schema_migrations."
            exit 1
          fi

      # Full pgTAP suite (every file in supabase/tests/database/): definer
      # grant guard, dashboard capture, cross-user RLS isolation, trust plane,
      # profile preferences. Locally: `npm run test:db`.
      - name: pgTAP suite
        run: supabase test db

      # Generated-types drift check: src/lib/database.types.ts must equal the
      # types generated from the schema the migrations just produced. A PR
      # that changes the schema without regenerating types fails here.
      # Fix: npx supabase@2.76.9 start && npx supabase@2.76.9 db reset
      # --no-seed && npm run gen:types:local, then commit the file.
      # scripts/gen-types.mjs pins the same CLI version as setup-cli above.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies (Biome for type normalization)
        run: npm ci --ignore-scripts

      - name: Check database.types.ts matches migrated schema
        env:
          SUPABASE_BIN: supabase
        run: npm run gen:types:check

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true
