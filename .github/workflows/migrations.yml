name: Migrations

# Catches the "repair-without-apply" footgun that caused 2026-04-20 drift.
# Boots a fresh Supabase stack, applies every migration file in order,
# and fails if any statement errors. A clean apply proves the migrations
# folder is self-consistent and can regenerate prod schema from scratch.
#
# Out of scope: diff vs live prod. That gate requires prod credentials
# in CI and is tracked as a follow-up. See CLAUDE.md -> "Migration
# Workflow Discipline".

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "scripts/ci/sync-queue-triage/**"
      - "scripts/ci/sync-queue-dedupe/**"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/ci/sync-queue-triage/**"
      - "scripts/ci/sync-queue-dedupe/**"

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-apply:
    name: Clean apply from empty DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.76.9

      # Neutralize seed.sql for the clean-apply check. This job only verifies
      # that every migration applies cleanly from an empty DB; it should NOT
      # execute production seed data. The checkout is ephemeral so this
      # overwrite never touches the committed file.
      #
      # Context: the committed seed.sql raises
      #   'No user found in auth.users. Sign up first!'
      # when run against a fresh DB with no users — which is exactly what this
      # CI job has. Seeding is orthogonal to drift detection.
      - name: Disable seed.sql for clean-apply check
        run: echo "-- seed disabled for migrations CI; see .github/workflows/migrations.yml" > supabase/seed.sql

      - name: Start local Supabase stack
        run: supabase start --ignore-health-check

      - name: Reset DB and apply all migrations
        run: supabase db reset --no-seed

      - name: List applied migrations
        run: supabase migration list --local

      - name: Fail on file-vs-applied count mismatch
        shell: bash
        run: |
          # Any migration file not tracked as applied by the local CLI
          # after db reset indicates a rejection or silent skip.
          file_count=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)
          applied_count=$(supabase migration list --local 2>/dev/null | grep -E '^\s*[0-9]+' | wc -l)
          echo "files=$file_count applied=$applied_count"
          if [ "$file_count" -ne "$applied_count" ]; then
            echo "::error::Migration file count ($file_count) != applied count ($applied_count). Drift between supabase/migrations and schema_migrations."
            exit 1
          fi

      # PR 31 (R-14/R-22): seed a stale sync_queue backlog, check the
      # operator's read-only dry run against the expected disjoint counts,
      # re-apply the scheduler migration so its OWN triage call runs over the
      # backlog, and assert every row's outcome.
      - name: Sync-queue backlog triage through the scheduler migration
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          test -n "$DB_URL"
          dir=scripts/ci/sync-queue-triage
          # The backlog fixture predates PR 52's `sync_queue_one_active`
          # (20260920005200), which `db reset` above has already created — and
          # a fixture full of duplicates is exactly what it forbids. Drop it to
          # reproduce the pre-PR-52 state; the next step seeds more duplicates
          # on top and re-applies 20260920005200, which recreates it.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -c 'DROP INDEX IF EXISTS public.sync_queue_one_active'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/seed.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -f "$dir/dry_run.sql" > "$RUNNER_TEMP/dry_run.txt"
          diff -u "$dir/expected_dry_run.txt" "$RUNNER_TEMP/dry_run.txt"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260920003100_scheduler_and_sync_queue_cron.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/check.sql"

      # PR 52: seed duplicate ACTIVE rows (the pre-migration prod state, with
      # the index dropped by the step above), apply
      # 20260920005200_sync_queue_pending_unique.sql over them and assert every
      # row's outcome — then apply it AGAIN and assert the same thing, which is
      # the idempotence proof the migration discipline requires.
      - name: Sync-queue dedupe and unique index (seeded duplicates, applied twice)
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          test -n "$DB_URL"
          dir=scripts/ci/sync-queue-dedupe
          migration=supabase/migrations/20260920005200_sync_queue_pending_unique.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/seed.sql"
          for attempt in 1 2; do
            echo "--- apply $attempt"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$dir/check.sql"
          done

      # SECURITY DEFINER grant guard: fails if any definer function in public
      # is executable by anon/authenticated outside the browser allow-list,
      # or lacks a pinned search_path. The full pgTAP suite is enabled
      # separately; this runs the guard file plus the PR 2 dashboard-capture
      # file (acceptance for 20260920000200) and the PR 31 scheduler file
      # (acceptance for 20260920003100).
      - name: pgTAP definer function grant guard, dashboard capture, scheduler and sync-queue dedupe
        run: supabase test db supabase/tests/database/definer_function_grants.test.sql supabase/tests/database/dashboard_capture.test.sql supabase/tests/database/scheduler.test.sql supabase/tests/database/sync_queue_dedupe.test.sql

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true
