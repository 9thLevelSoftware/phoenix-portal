name: Deploy Edge Functions

# Deploys all local Edge Functions to the production Supabase project on merges
# to main that change function source or function config.
#
# This exists alongside the Supabase Branching GitHub App integration (the
# "Supabase Preview" check) to provide a deterministic merge-to-main deploy
# path for Edge Functions independent of Branching's preview-branch lifecycle.
# Database migrations are deployed by the Supabase GitHub App.
#
# Required repository secrets:
#   - SUPABASE_ACCESS_TOKEN         Personal access token from
#                                   https://supabase.com/dashboard/account/tokens
#   - SUPABASE_PROD_PROJECT_REF     Project ref of the prod Supabase project
#                                   (the 20-char string in the dashboard URL)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Serialize function deploys; never cancel an in-flight prod upload.
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: configure required reviewers / branch restrictions
    # on the `production` environment in repo settings for an extra approval gate.
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Production functions only ever ship from main. Guard against a
      # workflow_dispatch run selecting a feature branch or stale commit.
      - name: Enforce main-only deploys
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Edge Function deploys are restricted to refs/heads/main (got $GITHUB_REF). Re-run from main."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.76.9

      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_PROD_PROJECT_REF" ] && missing+=("SUPABASE_PROD_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See the header comment in this workflow for provisioning steps."
            exit 1
          fi

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
        run: |
          echo "Deploying all local Edge Functions to project $PROJECT_REF"
          supabase functions deploy --project-ref "$PROJECT_REF"
