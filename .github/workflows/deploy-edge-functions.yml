name: Deploy Edge Functions

# Deploys all local Edge Functions to the production Supabase project on merges
# to main that change function source or function config.
#
# This exists alongside the Supabase Branching GitHub App integration (the
# "Supabase Preview" check) to provide a deterministic merge-to-main deploy
# path for Edge Functions independent of Branching's preview-branch lifecycle.
#
# Migration owner: production migrations are applied by the human operator with
# `supabase db push` (see AGENTS.md -> "Release order" and CLAUDE.md ->
# "Migration Workflow Discipline"). They are NOT applied by the Supabase GitHub
# App: its `main` branch record has reported MIGRATIONS_FAILED since
# 2026-03-16, so nothing in the repo may rely on it to migrate prod.
#
# Two gates run before any upload:
#   1. `verify`: the Edge type-check and handler tests (`check:edge-functions`,
#      `test:edge`) must pass on this exact commit. A red test blocks deploy.
#   2. `Gate on prod migrations`: every local `supabase/migrations/*.sql`
#      version must already be applied to prod (`supabase migration list
#      --linked`). If not, the deploy fails and names the missing versions.
#      The operator applies them with `supabase db push`, then re-runs this
#      workflow from main via `workflow_dispatch`. This keeps the order
#      migration -> Edge code (expand/contract, KD-3).
#
# Required `production` environment secrets:
#   - SUPABASE_ACCESS_TOKEN         Personal access token from
#                                   https://supabase.com/dashboard/account/tokens
#   - SUPABASE_PROD_PROJECT_REF     Project ref of the prod Supabase project
#                                   (the 20-char string in the dashboard URL)
#   - SUPABASE_PROD_DB_PASSWORD     Database password for the prod project, used
#                                   only by `supabase link` /
#                                   `supabase migration list --linked` (read-only;
#                                   same secret prod-migration-drift.yml uses)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Serialize function deploys; never cancel an in-flight prod upload.
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Edge Functions (type-check + handler tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.2.15
      - run: npm ci
      - name: Type-check Edge Functions
        run: npm run check:edge-functions
      - name: Run Edge handler tests
        run: npm run test:edge

  deploy:
    name: Deploy Edge Functions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: configure required reviewers / branch restrictions
    # on the `production` environment in repo settings for an extra approval gate.
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Production functions only ever ship from main. Guard against a
      # workflow_dispatch run selecting a feature branch or stale commit.
      - name: Enforce main-only deploys
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Edge Function deploys are restricted to refs/heads/main (got $GITHUB_REF). Re-run from main."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.76.9

      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_PROD_PROJECT_REF" ] && missing+=("SUPABASE_PROD_PROJECT_REF")
          [ -z "$SUPABASE_PROD_DB_PASSWORD" ] && missing+=("SUPABASE_PROD_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See the header comment in this workflow for provisioning steps."
            exit 1
          fi

      # Refuse to deploy Edge code while any local migration is missing from
      # prod. Read-only: `link` + `migration list` never write to the database.
      # Parsing mirrors prod-migration-drift.yml (CLI 2.76.9 has no
      # machine-readable output flag). Fails closed: a CLI error, or a parse
      # that yields no remote versions, reports every local version as missing.
      - name: Gate on prod migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          set -euo pipefail
          redact() {
            sed -E 's#(postgres(ql)?://[^:[:space:]]+:)[^@[:space:]]+@#\1***@#g; s#(password=)[^[:space:]]+#\1***#g' "$1"
          }

          if ! supabase link --project-ref "$SUPABASE_PROD_PROJECT_REF" -p "$SUPABASE_PROD_DB_PASSWORD" > link.out 2> link.err; then
            echo "::error::supabase link failed; refusing to deploy without verifying prod migrations."
            redact link.err
            exit 1
          fi

          if ! supabase migration list --linked > migration_list.out 2> migration_list.err; then
            echo "::error::supabase migration list --linked failed; refusing to deploy without verifying prod migrations."
            redact migration_list.err
            exit 1
          fi

          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            basename "$f" | sed -E 's/^([0-9]+)_.*/\1/'
          done | sort -u > local_migrations.txt

          (
          python3 <<'PY'
          import re
          from pathlib import Path

          ansi = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]")
          versions = set()
          for raw_line in Path("migration_list.out").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines():
              line = ansi.sub("", raw_line)
              columns = [c.strip().strip("`") for c in re.split(r"[|│]", line)]
              if len(columns) >= 4 and columns[0] == "" and columns[-1] == "":
                  columns = columns[1:]
              if len(columns) < 3:
                  continue
              match = re.search(r"\b(\d+)\b", columns[1])
              if match:
                  versions.add(match.group(1))
          for version in sorted(versions):
              print(version)
          PY
          ) | tr -d '\r' | sort -u > remote_migrations.txt
          if [ ! -s remote_migrations.txt ]; then
            echo "::warning::Parsed zero applied versions from the Supabase CLI output; the table format may have changed. Check 'supabase migration list --linked' locally before running db push."
          fi

          echo "Local migrations: $(wc -l < local_migrations.txt | tr -d ' ')"
          echo "Applied in prod:  $(wc -l < remote_migrations.txt | tr -d ' ')"

          unapplied=$(comm -23 local_migrations.txt remote_migrations.txt)
          if [ -n "$unapplied" ]; then
            echo "::error::Edge deploy blocked: local migrations not applied to prod: $(echo "$unapplied" | tr '\n' ' ')"
            while IFS= read -r version; do echo "  - $version"; done <<< "$unapplied"
            echo ""
            echo "The operator must apply them first (from a main checkout, after supabase link):"
            echo "  supabase db push"
            echo "verify the migration's artifact in prod, then re-run this workflow from main"
            echo "via workflow_dispatch (Actions -> Deploy Edge Functions -> Run workflow)."
            exit 1
          fi
          echo "All local migrations are applied to prod; proceeding with deploy."

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
        run: |
          echo "Deploying all local Edge Functions to project $PROJECT_REF"
          supabase functions deploy --project-ref "$PROJECT_REF"
