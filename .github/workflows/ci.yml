name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:security

  lint:
    name: Biome Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: biomejs/setup-biome@v2
        with:
          version: "2.4.8"
      - run: biome check .

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  edge-functions:
    name: Edge Function Deno Check and Handler Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.2.15
      - name: Type-check Edge Functions
        run: npm run check:edge-functions
      - name: Run mobile-sync-push/pull handler tests (in-process doubles)
        run: npm run test:edge

  unit-test:
    name: Vitest Unit Tests (mock Edge default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Playwright E2E (mocked REST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
      - run: npm run assert:no-sourcemaps
      # TODO: Add post-deploy smoke test (curl production URL for HTTP 200)
      # A real Cloudflare Pages deploy step should be followed by a smoke test
      # that verifies the deployed URL returns HTTP 200, catching any env-var
      # deletion or misconfiguration that the placeholder-based build cannot detect.
      - name: "TODO: Post-deploy smoke test placeholder"
        run: |
          echo "TODO: Add post-deploy smoke test (curl production URL for HTTP 200)"
