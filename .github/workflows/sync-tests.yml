name: Sync Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/mobile-sync-*/**'
      - 'tests/sync/**'
      - 'src/schemas/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/sync-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/mobile-sync-*/**'
      - 'tests/sync/**'
      - 'src/schemas/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/sync-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  workflow_dispatch:
    inputs:
      use_mocks:
        description: 'Run with mock Edge Functions'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  sync-tests:
    name: Sync Validation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Track the repository's canonical runtime (.nvmrc) so sync tests run
          # under the same Node version as the rest of CI.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync tests (mock mode)
        if: ${{ github.event.inputs.use_mocks == 'true' || github.event_name != 'workflow_dispatch' }}
        run: npm run test:sync
        env:
          MOCK_EDGE_FUNCTIONS: 'true'

      - name: Validate Supabase secrets for live mode
        if: ${{ github.event.inputs.use_mocks == 'false' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Required staging Supabase secrets not configured for live tests. Configure SYNC_STAGING_SUPABASE_URL, SYNC_STAGING_SUPABASE_ANON_KEY, and SYNC_STAGING_SUPABASE_SERVICE_ROLE_KEY in repository secrets."
            exit 1
          fi

          # Defence in depth: explicitly reject known production hosts...
          case "$SUPABASE_URL" in
            *"ilzlswmatadlnsuxatcv.supabase.co"*|*"api.phoenix-portal.com"*)
              echo "::error::Refusing to run live sync tests against a known production Supabase URL."
              exit 1
              ;;
          esac

          # ...then fail closed: the staging URL must match an explicitly
          # configured staging ref/host allowlist. This prevents a misconfigured
          # SYNC_STAGING_SUPABASE_URL (e.g. a new prod ref or custom domain) from
          # silently being treated as staging.
          if [ -z "$EXPECTED_STAGING_PROJECT_REF" ]; then
            echo "::error::SYNC_STAGING_PROJECT_REF is not configured. Set it to the staging project ref to enable live tests (fail-closed allowlist)."
            exit 1
          fi
          case "$SUPABASE_URL" in
            "https://$EXPECTED_STAGING_PROJECT_REF.supabase.co"*|"https://$EXPECTED_STAGING_PROJECT_REF.supabase.in"*)
              echo "Live sync target matches the configured staging project ref."
              ;;
            *)
              echo "::error::SYNC_STAGING_SUPABASE_URL does not match SYNC_STAGING_PROJECT_REF ($EXPECTED_STAGING_PROJECT_REF). Refusing to run live tests against an unrecognized host."
              exit 1
              ;;
          esac
          echo "All required staging Supabase secrets are configured"
        env:
          SUPABASE_URL: ${{ secrets.SYNC_STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SYNC_STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SYNC_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_STAGING_PROJECT_REF: ${{ secrets.SYNC_STAGING_PROJECT_REF }}

      - name: Run sync tests (live mode)
        if: ${{ github.event.inputs.use_mocks == 'false' }}
        run: npm run test:sync:live
        env:
          SUPABASE_URL: ${{ secrets.SYNC_STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SYNC_STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SYNC_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          MOCK_EDGE_FUNCTIONS: 'false'
          SYNC_LIVE_TESTS: 'true'

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sync-test-results
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  sync-tests-matrix:
    name: Sync Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync tests
        run: npm run test:sync
        env:
          MOCK_EDGE_FUNCTIONS: 'true'
