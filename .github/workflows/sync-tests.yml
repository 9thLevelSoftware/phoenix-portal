name: Sync Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/mobile-sync-*/**'
      - 'tests/sync/**'
      - 'src/schemas/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/sync-tests.yml'
      - 'scripts/resolve-sync-preview.mjs'
      - 'scripts/cleanup-sync-preview-users.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/mobile-sync-*/**'
      - 'tests/sync/**'
      - 'src/schemas/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/sync-tests.yml'
      - 'scripts/resolve-sync-preview.mjs'
      - 'scripts/cleanup-sync-preview-users.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  workflow_dispatch:
    inputs:
      use_mocks:
        description: 'Run with mock Edge Functions'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      staging_project_ref:
        description: 'Expected isolated Supabase preview project ref for live mode'
        required: false
        type: string

jobs:
  sync-tests:
    name: Sync Validation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Track the repository's canonical runtime (.nvmrc) so sync tests run
          # under the same Node version as the rest of CI.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync tests (mock mode)
        if: ${{ github.event.inputs.use_mocks == 'true' || github.event_name != 'workflow_dispatch' }}
        run: npm run test:sync
        env:
          MOCK_EDGE_FUNCTIONS: 'true'

      - name: Resolve Supabase preview credentials for live mode
        if: ${{ github.event.inputs.use_mocks == 'false' }}
        run: node scripts/resolve-sync-preview.mjs
        env:
          SYNC_STAGING_SUPABASE_URL: ${{ secrets.SYNC_STAGING_SUPABASE_URL }}
          SYNC_STAGING_SUPABASE_ANON_KEY: ${{ secrets.SYNC_STAGING_SUPABASE_ANON_KEY }}
          SYNC_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SYNC_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_STAGING_PROJECT_REF: ${{ secrets.SYNC_STAGING_PROJECT_REF }}
          STAGING_PROJECT_REF_INPUT: ${{ inputs.staging_project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}

      - name: Run sync tests (live mode)
        if: ${{ github.event.inputs.use_mocks == 'false' }}
        run: npm run test:sync:live
        env:
          MOCK_EDGE_FUNCTIONS: 'false'
          SYNC_LIVE_TESTS: 'true'
          SYNC_LIVE_DEBUG_FAILURES: 'true'

      - name: Clean up live sync test users
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.use_mocks == 'false' }}
        run: node scripts/cleanup-sync-preview-users.mjs
        env:
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sync-test-results
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  sync-tests-matrix:
    name: Sync Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync tests
        run: npm run test:sync
        env:
          MOCK_EDGE_FUNCTIONS: 'true'
