name: Feature Request
description: Suggest a new feature or enhancement for Phoenix Portal
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      description: Which part of the Phoenix ecosystem should this feature apply to?
      options:
        - Web Portal only
        - Mobile App only
        - Both (Web Portal & Mobile App)
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area of the web portal does this relate to?
      options:
        - Dashboard & Overview
        - Analytics & Charts
        - Routine Builder
        - Cycle Builder
        - Session Replay
        - Community & Leaderboards
        - Billing & Subscription
        - Mobile-to-Portal Sync
        - UI / UX
        - Notifications & Alerts
        - Data Export / GDPR
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the current pain point?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented.
      placeholder: "I would like..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would significantly improve my experience
        - Critical for my use case
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I am willing to help test this feature when implemented
          required: false
